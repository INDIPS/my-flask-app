<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JARVIS - AI Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 600px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
            border-bottom: 3px solid #764ba2;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        .status {
            font-size: 0.9em;
            opacity: 0.9;
        }

        .status.online::before {
            content: "● ";
            color: #4ade80;
        }

        .chat-box {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }

        .message {
            margin-bottom: 15px;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.user {
            text-align: right;
        }

        .message.ai {
            text-align: left;
        }

        .message-content {
            display: inline-block;
            padding: 12px 16px;
            border-radius: 12px;
            max-width: 80%;
            word-wrap: break-word;
        }

        .message.user .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 3px;
        }

        .message.ai .message-content {
            background: #e9ecef;
            color: #333;
            border-bottom-left-radius: 3px;
        }

        .timestamp {
            font-size: 0.75em;
            opacity: 0.6;
            margin-top: 5px;
        }

        .input-area {
            padding: 20px;
            background: white;
            border-top: 1px solid #e9ecef;
            display: flex;
            gap: 10px;
        }

        .input-group {
            flex: 1;
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e9ecef;
            border-radius: 10px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: 600;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .mic-button {
            padding: 12px 16px;
        }

        .loading {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.5;
            }
        }

        .loader {
            display: flex;
            gap: 4px;
            justify-content: center;
            padding: 10px 0;
        }

        .loader span {
            width: 8px;
            height: 8px;
            background: #667eea;
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }

        .loader span:nth-child(1) {
            animation-delay: 0s;
        }

        .loader span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loader span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .command-hint {
            font-size: 0.85em;
            color: #999;
            margin-top: 10px;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 8px;
            text-align: center;
        }
    </style>
</head>
<body>  
    <div class="container">
        <div class="header">
            <h1>🤖 SAM</h1>
            <p class="status online">Online AI Assistant</p>
        </div>

        <div class="chat-box" id="chatBox">
            <div class="message ai">
                <div class="message-content">
                    Hello! I'm Sam, your personal AI assistant. How can I help you today?
                </div>
                <div class="timestamp" id="timestamp0"></div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-group">
                <input 
                    type="text" 
                    id="commandInput" 
                    placeholder="Type a command... (e.g., 'What time is it?')" 
                    autocomplete="off"
                >
                <button id="sendBtn">Send</button>
                <button id="voiceBtn" class="mic-button" title="Voice Input">🎤</button>
                <button id="uploadBtn" class="mic-button" title="Upload File">📁</button>
                <button id="cameraBtn" class="mic-button" title="Camera">📷</button>
            </div>
            <input type="file" id="fileInput" style="display: none;" accept="*">
            <input type="file" id="cameraInput" style="display: none;" accept="image/*" capture="environment">
            <video id="cameraPreview" style="display: none; width: 100%; max-width: 300px; margin-top: 10px; border-radius: 10px;"></video>
            <canvas id="cameraCanvas" style="display: none;"></canvas>
        </div>

        <div class="command-hint">
            Ask anything and JARVIS will answer using an online AI server.
            Try: "What is the weather?" • "Wikipedia Python" • "How do I write Python?" • "Open Chrome" • "CPU usage"
        </div>
    </div>

    <script>
        const chatBox = document.getElementById('chatBox');
        const commandInput = document.getElementById('commandInput');
        const sendBtn = document.getElementById('sendBtn');
        const voiceBtn = document.getElementById('voiceBtn');
        let messageCount = 1;

        // Add message to chat
        function addMessage(text, sender = 'ai') {
            const message = document.createElement('div');
            message.className = `message ${sender}`;
            
            const content = document.createElement('div');
            content.className = 'message-content';
            content.textContent = text;
            
            const timestamp = document.createElement('div');
            timestamp.className = 'timestamp';
            timestamp.textContent = new Date().toLocaleTimeString();
            
            message.appendChild(content);
            message.appendChild(timestamp);
            
            chatBox.appendChild(message);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Show loading indicator
        function showLoading() {
            const loader = document.createElement('div');
            loader.className = 'loader';
            loader.id = 'loader';
            loader.innerHTML = '<span></span><span></span><span></span>';
            chatBox.appendChild(loader);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Remove loading indicator
        function removeLoading() {
            const loader = document.getElementById('loader');
            if (loader) loader.remove();
        }

        // Handle Wikipedia queries
        async function handleWikipedia(query) {
            try {
                const response = await fetch(`https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(query)}`);
                const data = await response.json();
                if (data.extract) {
                    return data.extract;
                } else {
                    return "Sorry, I couldn't find information on that topic on Wikipedia.";
                }
            } catch (error) {
                return "Error fetching information from Wikipedia. Please try again.";
            }
        }

        // Send command
        async function sendCommand() {
            const command = commandInput.value.trim();
            if (!command) return;

            addMessage(command, 'user');
            commandInput.value = '';
            
            if (command.toLowerCase().startsWith('wikipedia ') || command.toLowerCase().startsWith('wiki ')) {
                const query = command.split(' ').slice(1).join(' ');
                if (!query) {
                    addMessage('Please provide a topic to search on Wikipedia. For example: "wikipedia Python"', 'ai');
                    return;
                }
                showLoading();
                const result = await handleWikipedia(query);
                removeLoading();
                addMessage(result, 'ai');
                // Text-to-speech
                if ('speechSynthesis' in window) {
                    const utterance = new SpeechSynthesisUtterance(result);
                    // Try to pick a natural/neural voice
                    const voices = window.speechSynthesis.getVoices();
                    const naturalVoice = voices.find(v => 
                        (v.name.includes('Natural') || v.name.includes('Google')) && v.lang.startsWith('en')
                    );
                    if (naturalVoice) utterance.voice = naturalVoice;
                    speechSynthesis.speak(utterance);
                }
                return;
            }

            showLoading();

            try {
                const response = await fetch('/api/command', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ command: command })
                });

                removeLoading();

                const data = await response.json();
                addMessage(data.response, 'ai');

                // Text-to-speech
                if ('speechSynthesis' in window) {
                    const utterance = new SpeechSynthesisUtterance(data.response);
                    // Try to pick a natural/neural voice
                    const voices = window.speechSynthesis.getVoices();
                    const naturalVoice = voices.find(v => 
                        (v.name.includes('Natural') || v.name.includes('Google')) && v.lang.startsWith('en')
                    );
                    if (naturalVoice) utterance.voice = naturalVoice;
                    speechSynthesis.speak(utterance);
                }
            } catch (error) {
                removeLoading();
                addMessage('Sorry, something went wrong. Please try again.', 'ai');
                console.error('Error:', error);
            }
        }

        // Send button click
        sendBtn.addEventListener('click', sendCommand);

        // Enter key press
        commandInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                sendCommand();
            }
        });

        // Voice button click
        voiceBtn.addEventListener('click', () => {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                const recognition = new SpeechRecognition();
                
                recognition.onstart = () => {
                    voiceBtn.textContent = '🎤 Listening...';
                };
                
                recognition.onresult = (event) => {
                    const transcript = Array.from(event.results)
                        .map(result => result[0].transcript)
                        .join('');
                    commandInput.value = transcript;
                    voiceBtn.textContent = '🎤';
                };
                
                recognition.onerror = () => {
                    voiceBtn.textContent = '🎤';
                    addMessage('Voice recognition failed. Please try typing instead.', 'ai');
                };
                
                recognition.onend = () => {
                    voiceBtn.textContent = '🎤';
                };
                
                recognition.start();
            } else {
                alert('Voice input not supported in your browser');
            }
        });

        // File Upload Button
        const uploadBtn = document.getElementById('uploadBtn');
        const fileInput = document.getElementById('fileInput');
        const cameraBtn = document.getElementById('cameraBtn');
        const cameraInput = document.getElementById('cameraInput');

        uploadBtn.addEventListener('click', () => {
            fileInput.click();
        });

        fileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            addMessage(`Uploading file: ${file.name}`, 'user');
            showLoading();

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });

                removeLoading();
                const data = await response.json();

                if (response.ok) {
                    addMessage(`✅ File uploaded successfully: ${data.filename}`, 'ai');
                    // Display image if it's an image file
                    if (file.type.startsWith('image/')) {
                        const imgElement = document.createElement('img');
                        imgElement.src = data.url;
                        imgElement.style.maxWidth = '100%';
                        imgElement.style.borderRadius = '8px';
                        imgElement.style.marginTop = '10px';
                        const lastMsg = chatBox.lastChild;
                        lastMsg.appendChild(imgElement);
                    }
                } else {
                    addMessage(`❌ Upload failed: ${data.error}`, 'ai');
                }
            } catch (error) {
                removeLoading();
                addMessage('Error uploading file. Please try again.', 'ai');
                console.error('Upload error:', error);
            }

            fileInput.value = '';
        });

        // Camera Button
        cameraBtn.addEventListener('click', () => {
            cameraInput.click();
        });

        cameraInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            addMessage(`Uploading photo from camera: ${file.name}`, 'user');
            showLoading();

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/api/upload', {
                    method: 'POST',
                    body: formData
                });

                removeLoading();
                const data = await response.json();

                if (response.ok) {
                    addMessage(`✅ Photo uploaded successfully: ${data.filename}`, 'ai');
                    // Display the captured image
                    const imgElement = document.createElement('img');
                    imgElement.src = data.url;
                    imgElement.style.maxWidth = '100%';
                    imgElement.style.borderRadius = '8px';
                    imgElement.style.marginTop = '10px';
                    const lastMsg = chatBox.lastChild;
                    lastMsg.appendChild(imgElement);
                } else {
                    addMessage(`❌ Photo upload failed: ${data.error}`, 'ai');
                }
            } catch (error) {
                removeLoading();
                addMessage('Error uploading photo. Please try again.', 'ai');
                console.error('Camera upload error:', error);
            }

            cameraInput.value = '';
        });

        // Auto-focus input
        commandInput.focus();
    </script>
</body>
</html>
