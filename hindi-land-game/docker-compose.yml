version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: hindi_land_db
    environment:
      POSTGRES_DB: hindi_land
      POSTGRES_USER: hindiland_user
      POSTGRES_PASSWORD: secure_password_change_me
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - hindi_land_network

  redis:
    image: redis:7-alpine
    container_name: hindi_land_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - hindi_land_network

  django:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hindi_land_backend
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    environment:
      DEBUG: 'True'
      SECRET_KEY: 'dev-key-change-in-production'
      DATABASE_URL: 'postgresql://hindiland_user:secure_password_change_me@postgres:5432/hindi_land'
      REDIS_URL: 'redis://redis:6379'
      ALLOWED_HOSTS: 'localhost,127.0.0.1,django'
      CORS_ALLOWED_ORIGINS: 'http://localhost:8080,http://localhost:3000'
    ports:
      - "8000:8000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
    networks:
      - hindi_land_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: hindi_land_frontend
    command: npm run dev
    ports:
      - "8080:8080"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    environment:
      REACT_APP_API_URL: 'http://django:8000/api'
    depends_on:
      - django
    networks:
      - hindi_land_network

volumes:
  postgres_data:
  redis_data:

networks:
  hindi_land_network:
    driver: bridge
